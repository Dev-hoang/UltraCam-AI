
name: UltraCam AI APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android Manifest
        run: |
          echo "=== MANIFEST CONTENT ==="
          nl -ba app/src/main/AndroidManifest.xml
          echo "=== XML DECLARATION COUNT ==="
          grep -o '<?xml' app/src/main/AndroidManifest.xml | wc -l

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UltraCam-AI-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
